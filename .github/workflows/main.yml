name: Generar APK Automatizado

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código fuente
      uses: actions/checkout@v4

    - name: Configurar Java de Android
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Manualmente
      uses: gradle/actions/setup-gradle@v4

    - name: Compilar APK de la Calculadora
      run: gradle assembleDebug

    - name: Buscar y Subir Archivo APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculadora-TasaCambio-APK
        path: "**/build/outputs/apk/debug/*.apk"
